<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 370px; margin: 0; color: #2a1830; }
  header { background: #ad1457; color: #fff; padding: 10px 12px; font-weight: 600; }
  main { padding: 12px; }
  label { display: block; margin: 8px 0 3px; font-size: 12px; color: #6b4a63; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #dcc6d4; border-radius: 6px; font-size: 13px; }
  button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #ad1457; color: #fff; font-weight: 600; cursor: pointer; }
  button.sec { background: #f6e9f0; color: #2a1830; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
  .erro { color: #b3261e; } .ok { color: #1d7a3a; }
  .hidden { display: none; }
  .who { font-size: 11px; color: #7b6274; margin-bottom: 6px; }
  .box { background: #fbf3f7; border: 1px solid #efd9e5; border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .box h4 { margin: 0 0 4px; font-size: 12px; color: #ad1457; }
  .row { display: flex; gap: 6px; } .row button { margin-top: 6px; }
  .preview { font-size: 12px; margin-top: 6px; line-height: 1.45; max-height: 150px; overflow: auto; }
  .preview b { color: #2a1830; }
  .falta { color: #b3261e; }
  small { color: #7b6274; }
  .filtro.on { background: #ad1457; color: #fff; }
  .lista { margin-top: 6px; max-height: 230px; overflow: auto; border: 1px solid #efd9e5; border-radius: 6px; }
  .it { display: flex; gap: 6px; align-items: flex-start; padding: 5px 7px; border-bottom: 1px solid #f6e9f0; font-size: 12px; }
  .it input { width: auto; margin-top: 2px; }
  .it .nm { cursor: pointer; flex: 1; }
  .it.sel .nm { color: #ad1457; font-weight: 600; }
  .tag { font-size: 10px; color: #fff; background: #7a5c8f; border-radius: 4px; padding: 0 4px; margin-right: 4px; }
  .tag.alt { background: #6d7a8f; }
  .it .falta, .it .nao { display: block; font-size: 11px; }
  .it .nao { color: #7b6274; }
  .res { font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>Cristina – Viabilidade Redesim SP · ASAP</header>
<main>
  <section id="sLogin" class="hidden">
    <div class="who">Entre com o seu usuário do Portal ASAP (o mesmo da Cláudia).</div>
    <label>E-mail</label><input id="email" type="email" autocomplete="username">
    <label>Senha</label><input id="senha" type="password" autocomplete="current-password">
    <button id="btnLogin">Entrar no portal</button>
  </section>

  <section id="sRun" class="hidden">
    <div class="who" id="who"></div>
    <div id="filaStatus" class="box hidden"></div>
    <label>Viabilidades pendentes</label>
    <div class="row" style="gap:4px">
      <button class="sec filtro on" data-f="todos" style="margin:0;padding:5px">Todos</button>
      <button class="sec filtro" data-f="abertura" style="margin:0;padding:5px">Abertura</button>
      <button class="sec filtro" data-f="alteracao" style="margin:0;padding:5px">Alteração</button>
    </div>
    <input id="busca" placeholder="Buscar por nome ou CNPJ" style="margin-top:6px">
    <div class="row" style="gap:4px;align-items:center;margin-top:6px;font-size:12px">
      <label style="display:flex;gap:5px;align-items:center;margin:0;color:#2a1830"><input type="checkbox" id="todosProntos" style="width:auto"> Marcar todos os prontos</label>
      <span id="contSel" style="margin-left:auto;color:#7b6274"></span>
    </div>
    <div id="lista" class="lista"><small>Carregando…</small></div>
    <button id="btnFila">Fazer os selecionados</button>
    <div id="preview" class="preview"></div>

    <div class="box">
      <h4 id="aulaTit">O que eu sei</h4>
      <div id="aulaInfo"><small>Ainda não aprendi a viabilidade.</small></div>
      <button id="btnGravar" class="sec">Aprender com o processo em destaque (gravar aula)</button>
      <label style="display:flex;gap:6px;align-items:center;color:#2a1830;margin-top:8px"><input type="checkbox" id="autoFin" style="width:auto"> Finalizar a solicitação e lançar o número no portal sozinha</label>
      <div class="row">
        <button id="btnBaixar" class="sec" disabled>Baixar aula</button>
        <button id="btnImportar" class="sec">Carregar aula</button>
        <button id="btnEsquecer" class="sec" disabled>Esquecer</button>
      </div>
      <input id="arq" type="file" accept=".json" class="hidden">
    </div>

    <div class="box">
      <h4>Lançar o número no portal</h4>
      <input id="numViab" placeholder="SPN0000000000" maxlength="13">
      <button id="btnLancar" class="sec">Lançar e marcar “Em análise”</button>
    </div>

    <button id="btnParar" class="sec">Parar o que estiver fazendo</button>
    <button id="btnSair" class="sec">Sair do portal</button>
  </section>
  <div id="msg" class="msg"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
